name: Product CI CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: |
          nohup npm start > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/; then
              echo "Product API is ready"
              exit 0
            fi

            echo "Waiting for Product API..."
            sleep 2
          done

          cat app.log
          exit 1

      - name: Test API health
        run: curl -f http://localhost:3000/

      - name: Test CREATE Product
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"P001","pname":"Laptop","price":15000000,"quantity":10}')

          echo "$RESPONSE"
          echo "$RESPONSE" | grep "Product created successfully"

      - name: Test READ Product
        run: |
          RESPONSE=$(curl -s http://localhost:3000/api/products/P001)

          echo "$RESPONSE"
          echo "$RESPONSE" | grep '"pid":"P001"'

      - name: Test UPDATE Product
        run: |
          RESPONSE=$(curl -s -X PUT http://localhost:3000/api/products/P001 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Laptop Gaming","price":18000000,"quantity":8}')

          echo "$RESPONSE"
          echo "$RESPONSE" | grep "Product updated successfully"

      - name: Test DELETE Product
        run: |
          RESPONSE=$(curl -s -X DELETE http://localhost:3000/api/products/P001)

          echo "$RESPONSE"
          echo "$RESPONSE" | grep "Product deleted successfully"

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

  deploy-local:
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest Docker image
        run: docker pull letankiet/product-api:latest

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose-prod.yaml down
          docker compose -f docker-compose-prod.yaml up -d

      - name: Show containers
        run: docker compose -f docker-compose-prod.yaml ps

      - name: Verify Product API
        shell: powershell
        run: |
          Start-Sleep -Seconds 15
          Invoke-WebRequest http://localhost:3000/ -UseBasicParsing